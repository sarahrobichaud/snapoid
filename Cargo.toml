[package]
name = "snapoid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "7"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
