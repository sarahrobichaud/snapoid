[package]
name = "yapzm"
version = "0.1.0"
edition = "2024"
default-run = "yapzm"

# The -dev/-test targets are identical builds whose executable name
# selects the yapzm-dev / yapzm-test stores.
[[bin]]
name = "yapzm"
path = "src/main.rs"

[[bin]]
name = "yapzm-dev"
path = "src/bin/yapzm-dev.rs"

[[bin]]
name = "yapzm-test"
path = "src/bin/yapzm-test.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "7"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
