[workspace]
members = ["proto"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "7"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[package]
name = "yapzm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yapzm"
path = "src/main.rs"


[dependencies]
anyhow.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[target.'cfg(unix)'.dependencies]
dirs.workspace = true
